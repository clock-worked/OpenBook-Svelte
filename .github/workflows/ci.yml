name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py_services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Minimal closure for the CI test list (verified in a bare venv).
      # The full requirements.txt pulls torch/diffusers — not needed here.
      - run: pip install fastapi httpx spacy
      # test_chapter_review_service (spaCy 3.5 + en_core_web_sm) and
      # openbook_parser.test_modernbooknlp_service (booknlp) are local-only.
      - run: >
          python -m unittest
          test_parser_router
          test_jev_service
          test_import_boundaries
          test_character_store
          test_character_folder_migration
          openbook_parser.test_jev_verify
          openbook_parser.test_episode_decoder
          openbook_parser.test_closed_world_parser
          openbook_parser.test_character_folder_reader
