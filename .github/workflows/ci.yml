name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py_services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Minimal closure for the discovered tests (verified in a bare venv).
      # The full requirements.txt pulls torch/diffusers — not needed here.
      - run: pip install fastapi httpx spacy
      # Discovery picks up every test_*.py automatically; local-only suites
      # (local_chapter_review_service, openbook_parser/local_modernbooknlp_service)
      # use a local_ prefix so they are skipped.
      - run: python -m unittest discover -p 'test_*.py'
